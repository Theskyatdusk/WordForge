<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="description" content="WordForge - 智能英语背单词系统" />

    <!-- Prevent theme flash (FOUC): set data-theme before React mounts -->
    <script>
      (function () {
        var t = localStorage.getItem('wordforge_theme');
        if (!t) {
          t = 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>

    <!-- Fonts: use fonts.loli.net mirror (China-accessible Google Fonts mirror) -->
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin />
    <link
      href="https://fonts.loli.net/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- App loading splash (shown until React mounts) -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      [data-theme="dark"] #app-splash { background: #1a2332; }
      #app-splash .logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, #14b8a6, #0f766e);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 28px;
        font-weight: 800;
        font-family: system-ui, sans-serif;
        box-shadow: 0 4px 16px rgba(13,148,136,0.3);
        animation: splash-pulse 1.5s ease-in-out infinite;
      }
      #app-splash .label {
        margin-top: 16px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        color: #94a3b8;
        letter-spacing: 0.05em;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.85; }
      }
    </style>

    <title>WordForge - 智能背单词</title>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <div class="logo">W</div>
        <div class="label">WordForge</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
